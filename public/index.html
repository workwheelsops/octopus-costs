<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octopus Costs</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="dashboard" id="dashboard">
      <header class="brand-bar">
        <div class="brand-bar__left">
          <span class="brand-mark">O</span>
          <span class="brand-word">Octopus Costs</span>
        </div>
        <button type="button" class="refresh-btn" id="refresh-btn">Refresh</button>
      </header>

      <div class="context-strip">
        <span class="context-strip__month" id="context-month">&nbsp;</span>
        <span class="context-strip__meta" id="context-meta">&nbsp;</span>
      </div>

      <p class="error-line" id="error-line" hidden></p>

      <div class="hero-row" id="hero-row">
        <section class="hero-cell">
          <div class="eyebrow">Forecast this month</div>
          <div class="figure figure--forecast">
            <span class="figure__sign" id="forecast-sign"></span>
            <span class="figure__currency is-loading" id="forecast-currency">&pound;</span>
            <span class="figure__pounds is-loading" id="forecast-pounds">&nbsp;</span>
            <span class="figure__pence is-loading" id="forecast-pence">&nbsp;</span>
          </div>
          <div class="progress">
            <div class="progress__fill" id="forecast-progress-fill"></div>
          </div>
          <div class="caption" id="forecast-caption">&nbsp;</div>
        </section>

        <section class="hero-cell">
          <div class="eyebrow">Running total savings</div>
          <div class="figure figure--savings">
            <span class="figure__sign" id="savings-sign"></span>
            <span class="figure__currency is-loading" id="savings-currency">&pound;</span>
            <span class="figure__pounds is-loading" id="savings-pounds">&nbsp;</span>
            <span class="figure__pence is-loading" id="savings-pence">&nbsp;</span>
          </div>
          <div class="sparkline" id="savings-sparkline"></div>
          <div class="caption" id="savings-caption">&nbsp;</div>
        </section>
      </div>

      <section class="daily-panel">
        <div class="daily-panel__header">
          <span class="eyebrow">Cost per day</span>
          <div class="legend">
            <span class="legend__item"><span class="legend__swatch legend__swatch--actual"></span>Actual</span>
            <span class="legend__item"><span class="legend__swatch legend__swatch--forecast"></span>Forecast</span>
          </div>
        </div>
        <div class="daily-chart" id="daily-chart"></div>
        <div class="daily-axis" id="daily-axis"></div>
      </section>
    </main>

    <div class="bar-tooltip" id="bar-tooltip" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
